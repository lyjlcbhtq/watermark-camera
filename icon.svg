<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Camera body -->
  <rect x="96" y="156" width="320" height="240" rx="30" fill="#ffffff" opacity="0.15"/>
  <rect x="116" y="176" width="280" height="200" rx="20" fill="#ffffff" opacity="0.08"/>
  <!-- Lens -->
  <circle cx="320" cy="256" r="48" fill="none" stroke="#007aff" stroke-width="6" opacity="0.6"/>
  <circle cx="320" cy="256" r="20" fill="#007aff" opacity="0.4"/>
  <!-- Flash -->
  <circle cx="140" cy="200" r="10" fill="#ffd700" opacity="0.6"/>
  <!-- Watermark text -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="white" opacity="0.7">📷 水印相机</text>
  <!-- Time text -->
  <text x="256" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#007aff" opacity="0.5">14:30</text>
  <!-- Decorative rings -->
  <circle cx="256" cy="128" r="180" fill="none" stroke="#007aff" stroke-width="1" opacity="0.1"/>
  <circle cx="256" cy="128" r="220" fill="none" stroke="#007aff" stroke-width="1" opacity="0.05"/>
</svg>
