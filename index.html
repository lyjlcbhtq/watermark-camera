<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="水印相机">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%231a1a2e'/%3E%3Ctext x='256' y='320' text-anchor='middle' font-size='200'%3E📷%3C/text%3E%3C/svg%3E">
  <title>简单水印相机</title>

  <style>
    /* ==================== Reset & Base ==================== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
      background: #000;
      color: #fff;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    button { font-family: inherit; border: none; outline: none; cursor: pointer; touch-action: manipulation; }
    input { font-family: inherit; outline: none; border: none; }

    /* ==================== App Container ==================== */
    #app {
      position: relative;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* ==================== Camera Preview ==================== */
    #camera-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #111;
    }
    #camera-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ==================== Watermark Overlay (实时预览) ==================== */
    #watermark-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    /* 水印区域 - 四角定位容器 */
    .watermark-corner {
      position: absolute;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .watermark-corner .wm-line {
      font-size: 16px;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8), 0 0 2px rgba(0,0,0,0.5);
      letter-spacing: 0.5px;
      line-height: 1.3;
      max-width: 85vw;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      word-break: break-all;
    }
    .wm-size-sm .wm-line { font-size: 13px; }
    .wm-size-md .wm-line { font-size: 16px; }
    .wm-size-lg .wm-line { font-size: 20px; }
    .wm-size-xl .wm-line { font-size: 24px; }
    /* 小屏适配 */
    @media (max-width: 375px) {
      .wm-size-md .wm-line { font-size: 14px; }
      .wm-size-lg .wm-line { font-size: 17px; }
      .wm-size-xl .wm-line { font-size: 20px; }
    }
    .wm-corner-tl { top: 60px; left: 16px; align-items: flex-start; }
    .wm-corner-tr { top: 60px; right: 16px; align-items: flex-end; }
    .wm-corner-bl { bottom: 130px; left: 16px; align-items: flex-start; }
    .wm-corner-br { bottom: 130px; right: 16px; align-items: flex-end; }

    /* 水印颜色类 */
    .wm-color-white .wm-line { color: #fff; }
    .wm-color-yellow .wm-line { color: #ffd700; }
    .wm-color-red .wm-line { color: #ff3b30; }
    .wm-color-blue .wm-line { color: #5ac8fa; }
    .wm-color-green .wm-line { color: #34c759; }
    .wm-color-orange .wm-line { color: #ff9500; }

    /* ==================== 顶部栏 ==================== */
    #top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 54px 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
      z-index: 10;
    }
    #top-bar .title {
      font-size: 18px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .top-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .top-btn:active { background: rgba(255,255,255,0.3); }

    /* ==================== 模式切换 ==================== */
    #mode-bar {
      position: absolute;
      top: 104px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 3px;
      gap: 2px;
    }
    .mode-btn {
      padding: 8px 22px;
      border-radius: 19px;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      background: transparent;
      transition: all 0.3s ease;
    }
    .mode-btn.active {
      background: #007aff;
      color: #fff;
      box-shadow: 0 2px 10px rgba(0,122,255,0.4);
    }

    /* ==================== 底部控制区 ==================== */
    #bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 16px 24px 40px;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .bottom-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .bottom-btn:active { background: rgba(255,255,255,0.25); transform: scale(0.92); }

    /* 快门按钮 */
    #shutter-btn {
      width: 76px; height: 76px;
      border-radius: 50%;
      background: transparent;
      border: 4px solid rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      position: relative;
    }
    #shutter-btn .inner {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: #fff;
      transition: all 0.3s;
    }
    #shutter-btn:active .inner { transform: scale(0.85); }
    /* 录像中状态 */
    #shutter-btn.recording { border-color: #ff3b30; }
    #shutter-btn.recording .inner {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: #ff3b30;
    }
    #shutter-btn.recording { animation: pulse-record 1.5s ease-in-out infinite; }
    @keyframes pulse-record {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,59,48,0.4); }
      50% { box-shadow: 0 0 0 12px rgba(255,59,48,0); }
    }

    /* 录像计时器 */
    #recording-timer {
      display: none;
      position: absolute;
      top: 156px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 4px 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      color: #ff3b30;
      align-items: center;
      gap: 6px;
    }
    #recording-timer.show { display: flex; }
    #recording-timer .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ff3b30;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ==================== 面板 (设置/相册) ==================== */
    .panel-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .panel-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .panel {
      position: fixed;
      left: 0; right: 0;
      bottom: 0;
      z-index: 51;
      background: #1c1c1e;
      border-radius: 20px 20px 0 0;
      padding: 20px 20px 40px;
      max-height: 80vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
    }
    .panel.show {
      transform: translateY(0);
    }
    .panel-handle {
      width: 36px; height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.2);
      margin: 0 auto 16px;
    }
    .panel-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
    }

    /* 设置项 */
    .setting-group {
      margin-bottom: 20px;
    }
    .setting-group-title {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-label {
      font-size: 15px;
      font-weight: 500;
    }
    .setting-label .hint {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      font-weight: 400;
      display: block;
      margin-top: 2px;
    }

    /* 开关 */
    .toggle {
      width: 50px; height: 30px;
      border-radius: 15px;
      background: rgba(255,255,255,0.15);
      position: relative;
      transition: background 0.3s;
      flex-shrink: 0;
      cursor: pointer;
    }
    .toggle.on { background: #34c759; }
    .toggle .knob {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: #fff;
      position: absolute;
      top: 2px; left: 2px;
      transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    .toggle.on .knob { transform: translateX(20px); }

    /* 选择器 */
    .option-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .option-btn {
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
      transition: all 0.2s;
    }
    .option-btn.active {
      background: #007aff;
      color: #fff;
    }
    .option-btn:active { transform: scale(0.94); }

    /* 颜色选择 */
    .color-options {
      display: flex;
      gap: 12px;
    }
    .color-dot {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      transition: all 0.2s;
      cursor: pointer;
    }
    .color-dot.active { border-color: #fff; transform: scale(1.15); }

    /* 自定义文本输入 */
    #custom-text-input {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 15px;
      color: #fff;
    }
    #custom-text-input::placeholder { color: rgba(255,255,255,0.3); }
    #manual-addr-input::placeholder { color: rgba(255,255,255,0.3); }
    .setting-action-btn {
      padding:7px 16px; border-radius:16px; font-size:13px; font-weight:600;
      background:#007aff; color:#fff; transition:all 0.2s;
    }
    .setting-action-btn:active { transform:scale(0.94); opacity:0.8; }
    .setting-hint { font-size:13px; color:rgba(255,255,255,0.4); line-height:1.4; word-break:break-all; }

    /* ==================== 相册面板 ==================== */
    #gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }
    .gallery-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 4px;
      overflow: hidden;
      background: #2a2a2a;
    }
    .gallery-item img, .gallery-item video {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .gallery-item .media-type-badge {
      position: absolute;
      top: 6px; right: 6px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      border-radius: 8px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .gallery-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: rgba(255,255,255,0.3);
      font-size: 15px;
    }
    .gallery-empty .big-icon { font-size: 48px; margin-bottom: 12px; }

    /* ==================== 预览模态框 ==================== */
    #preview-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 60;
      background: #000;
      display: none;
      flex-direction: column;
    }
    #preview-modal.show { display: flex; }
    #preview-modal .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 54px 16px 12px;
      z-index: 1;
    }
    #preview-modal .preview-close {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #preview-modal .preview-media {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
    }
    #preview-modal .preview-media img,
    #preview-modal .preview-media video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
    #preview-modal .preview-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      padding: 20px 24px 48px;
    }
    .action-btn {
      padding: 12px 28px;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .action-btn.primary { background: #007aff; color: #fff; }
    .action-btn.secondary { background: rgba(255,255,255,0.1); color: #fff; }

    /* ==================== 状态提示 ==================== */
    #toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      z-index: 100;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 16px 28px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      max-width: 80%;
    }
    #toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* ==================== 滚动条 ==================== */
    .panel::-webkit-scrollbar { width: 4px; }
    .panel::-webkit-scrollbar-track { background: transparent; }
    .panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

    /* ==================== 适配 ==================== */
    @media (prefers-color-scheme: light) {
      /* 保持深色主题，相机 App 就该是黑的 */
    }
    @supports (padding-top: env(safe-area-inset-top)) {
      #top-bar { padding-top: calc(env(safe-area-inset-top) + 12px); }
      #bottom-bar { padding-bottom: calc(env(safe-area-inset-bottom) + 16px); }
      .panel { padding-bottom: calc(env(safe-area-inset-bottom) + 20px); }
      #preview-modal .preview-header { padding-top: calc(env(safe-area-inset-top) + 12px); }
      #preview-modal .preview-actions { padding-bottom: calc(env(safe-area-inset-bottom) + 24px); }
    }

    /* 相机启动遮挡 */
    #loading-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 5;
      transition: opacity 0.5s ease;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    #loading-overlay .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #007aff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-overlay .loading-text {
      margin-top: 16px;
      font-size: 14px;
      color: rgba(255,255,255,0.6);
    }
  </style>
</head>
<body>

<div id="app">
  <!-- 加载中 -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">正在启动相机...</div>
  </div>

  <!-- 相机预览 -->
  <div id="camera-container">
    <video id="camera-preview" autoplay playsinline muted></video>
  </div>

  <!-- 水印实时预览 -->
  <div id="watermark-overlay">
    <div class="watermark-corner wm-corner-tl" id="wm-tl">
      <span class="wm-line" id="wm-time-top"></span>
      <span class="wm-line" id="wm-date-top"></span>
      <span class="wm-line" id="wm-location-top"></span>
      <span class="wm-line" id="wm-custom-top"></span>
    </div>
    <div class="watermark-corner wm-corner-tr" id="wm-tr">
      <span class="wm-line" id="wm-time-top-right"></span>
      <span class="wm-line" id="wm-date-top-right"></span>
      <span class="wm-line" id="wm-location-top-right"></span>
      <span class="wm-line" id="wm-custom-top-right"></span>
    </div>
    <div class="watermark-corner wm-corner-bl" id="wm-bl">
      <span class="wm-line" id="wm-time-bottom"></span>
      <span class="wm-line" id="wm-date-bottom"></span>
      <span class="wm-line" id="wm-location-bottom"></span>
      <span class="wm-line" id="wm-custom-bottom"></span>
    </div>
    <div class="watermark-corner wm-corner-br" id="wm-br">
      <span class="wm-line" id="wm-time-bottom-right"></span>
      <span class="wm-line" id="wm-date-bottom-right"></span>
      <span class="wm-line" id="wm-location-bottom-right"></span>
      <span class="wm-line" id="wm-custom-bottom-right"></span>
    </div>
  </div>

  <!-- 顶部栏 -->
  <div id="top-bar">
    <button class="top-btn" id="btn-settings" aria-label="设置">⚙️</button>
    <span class="title">简单水印相机</span>
    <button class="top-btn" id="btn-switch-camera" aria-label="切换摄像头">🔄</button>
  </div>

  <!-- 模式切换 -->
  <div id="mode-bar">
    <button class="mode-btn active" data-mode="photo">📷 拍照</button>
    <button class="mode-btn" data-mode="video">🎬 录像</button>
  </div>

  <!-- 录像计时器 -->
  <div id="recording-timer">
    <span class="dot"></span>
    <span id="timer-display">00:00</span>
  </div>

  <!-- 底部控制 -->
  <div id="bottom-bar">
    <button class="bottom-btn" id="btn-gallery" aria-label="相册">🖼️</button>
    <button id="shutter-btn">
      <div class="inner"></div>
    </button>
    <button class="bottom-btn" id="btn-watermark-settings" aria-label="水印">🏷️</button>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- ==================== 水印设置面板 ==================== -->
  <div class="panel-overlay" id="watermark-panel-overlay"></div>
  <div class="panel" id="watermark-panel">
    <div class="panel-handle"></div>
    <div class="panel-title">🏷️ 水印设置</div>

    <div class="setting-group">
      <div class="setting-group-title">显示内容</div>
      <div class="setting-row">
        <span class="setting-label">显示时间</span>
        <div class="toggle on" id="toggle-time"><div class="knob"></div></div>
      </div>
      <div class="setting-row">
        <span class="setting-label">显示日期</span>
        <div class="toggle on" id="toggle-date"><div class="knob"></div></div>
      </div>
      <div class="setting-row">
        <span class="setting-label">显示地点</span>
        <div class="toggle on" id="toggle-location"><div class="knob"></div></div>
      </div>
      <div class="setting-row">
        <span class="setting-label">自定义文字</span>
        <div class="toggle" id="toggle-custom"><div class="knob"></div></div>
      </div>
      <div class="setting-row">
        <div style="flex:1">
          <span class="setting-label">自定义内容</span>
        </div>
        <input id="custom-text-input" type="text" placeholder="输入自定义文字..." maxlength="40" style="width:auto;flex:1;margin-left:12px;">
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-group-title">位置设置</div>
      <div class="setting-row">
        <span class="setting-label">手动输入地址</span>
        <div class="toggle" id="toggle-manual-addr"><div class="knob"></div></div>
      </div>
      <div class="setting-row">
        <div style="flex:1">
          <span class="setting-label">地址内容</span>
        </div>

<script>
// ============================================================
//  简单水印相机 - 完整 JavaScript
// ============================================================

(() => {
  'use strict';

  // ==================== DOM 引用 ====================
  const $ = id => document.getElementById(id);
  const video       = $('camera-preview');
  const shutterBtn  = $('shutter-btn');
  const modeBtns    = document.querySelectorAll('.mode-btn');
  const toast       = $('toast');
  const timerEl     = $('recording-timer');
  const timerDisplay= $('timer-display');

  // ==================== 状态 ====================
  let currentMode = 'photo'; // 'photo' | 'video'
  let isRecording = false;
  let useFrontCamera = false;
  let stream = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let recordingCanvas = null;
  let recordingCtx = null;
  let animFrameId = null;
  let canvasStream = null;
  let timerInterval = null;
  let seconds = 0;
  let currentLocation = null;
  let locationAddress = '';
  let locationError = false;

  // 水印状态
  let nearByPois = [];      // 附近地点列表
  let selectedPoi = '';     // 用户选择的附近地点

  const wmState = {
    showTime: true,
    showDate: true,
    showLocation: true,
    showCustom: false,
    customText: '',
    useManualAddr: false,
    manualAddr: '',
    usePoi: false,          // 是否使用附近地点
    position: 'tl',
    color: 'white',
    size: 'md',
  };

  // 相册
  let galleryItems = [];

  // ==================== 水印渲染函数 ====================
  function formatTime() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    return `${h}:${m}:${s}`;
  }
  function formatDate() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth()+1).padStart(2,'0');
    const d = String(now.getDate()).padStart(2,'0');
    const weekdays = ['日','一','二','三','四','五','六'];
    return `${y}-${m}-${d} 周${weekdays[now.getDay()]}`;
  }

  function updateWatermarkOverlay() {
    // 决定显示哪个角落
    const corners = ['tl','tr','bl','br'];
    corners.forEach(pos => {
      const el = $(`wm-${pos}`);
      el.style.display = pos === wmState.position ? 'flex' : 'none';
    });

    // 设置内容
    const p = wmState.position;
    const setEl = (id, val) => {
      const el = $(`${id}-${p}`);
      if (el) {
        el.textContent = val;
        el.style.display = val ? 'block' : 'none';
      }
    };

    setEl('wm-time', wmState.showTime ? formatTime() : '');
    setEl('wm-date', wmState.showDate ? formatDate() : '');
    let locText = '定位中...';
    if (wmState.useManualAddr) {
      locText = wmState.manualAddr;
    } else if (wmState.usePoi && selectedPoi) {
      locText = selectedPoi;
    } else if (locationAddress) {
      locText = locationAddress;
    } else if (locationError) {
      locText = '定位失败';
    }
    setEl('wm-location', wmState.showLocation ? locText : '');
    setEl('wm-custom', wmState.showCustom && wmState.customText ? wmState.customText : '');

    // 颜色 / 大小
    const overlay = $('watermark-overlay');
    ['white','yellow','red','blue','green','orange'].forEach(c => overlay.classList.remove(`wm-color-${c}`));
    overlay.classList.add(`wm-color-${wmState.color}`);

    ['sm','md','lg','xl'].forEach(s => overlay.classList.remove(`wm-size-${s}`));
    overlay.classList.add(`wm-size-${wmState.size}`);

    updateLocationHint();
  }

  // 高德地图 API Key（用户申请的）
  const AMAP_KEY = 'b6045d9bbac9de8d8642a71580218562';

  // WGS-84 (GPS) 转 GCJ-02 (高德/中国地图)
  function wgs84ToGcj02(wgsLat, wgsLng) {
    const a = 6378245.0, ee = 0.00669342162296594323;
    function transformLat(x, y) {
      let ret = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
      ret += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
      ret += (20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI)) * 2/3;
      ret += (160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30)) * 2/3;
      return ret;
    }
    function transformLng(x, y) {
      let ret = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
      ret += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
      ret += (20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI)) * 2/3;
      ret += (150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI)) * 2/3;
      return ret;
    }
    let dlat = transformLat(wgsLng-105, wgsLat-35);
    let dlng = transformLng(wgsLng-105, wgsLat-35);
    const rad = wgsLat/180*Math.PI;
    let m = 1 - ee*Math.pow(Math.sin(rad), 2);
    const sq = Math.sqrt(m);
    dlat = (dlat*180)/((a*(1-ee))/(m*sq)*Math.PI);
    dlng = (dlng*180)/(a/sq*Math.cos(rad)*Math.PI);
    return { lat: wgsLat+dlat, lng: wgsLng+dlng };
  }
  // ==================== 位置获取（改进版） ====================
  function startLocation() {
    if (!navigator.geolocation) {
      showToast('⚠️ 浏览器不支持定位');
      locationError = true;
      updateWatermarkOverlay();
      return;
    }
    locationAddress = '';
    locationError = false;
    updateWatermarkOverlay();

    // 用 watchPosition 持续获取（比 getCurrentPosition 更稳定）
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        // 先显示坐标（快速），更友好的格式
        locationAddress = `📍 ${currentLocation.lat.toFixed(4)}, ${currentLocation.lng.toFixed(4)}`;
        updateWatermarkOverlay();

        // 尝试逆地理编码获取地址（多个服务，谁先返回用谁）
        const geoPromises = [];

        // 同时尝试多个逆地理编码服务
        function strAddress(data, fallback) {
          if (!data) return null;
          const ad = data.address || data;
          const parts = [];
          if (ad.city || ad.town || ad.county || ad.state_district) parts.push(ad.city || ad.town || ad.county || ad.state_district);
          if (ad.district || ad.suburb || ad.borough) parts.push(ad.district || ad.suburb || ad.borough);
          if (ad.road || ad.street || ad.village) parts.push(ad.road || ad.street || ad.village);
          if (ad.name && !parts.includes(ad.name) && ad.name.length > 2) parts.push(ad.name);
          return parts.length ? parts.join(' ') : fallback || null;
        }

        // 服务1: 高德地图（先转换坐标再查询）
        const gcj = wgs84ToGcj02(currentLocation.lat, currentLocation.lng);
        window._lastGpsCoord = `GPS:${currentLocation.lat.toFixed(4)},${currentLocation.lng.toFixed(4)} → GCJ:${gcj.lat.toFixed(4)},${gcj.lng.toFixed(4)}`;
        geoPromises.push(
          fetch(`https://restapi.amap.com/v3/geocode/regeo?output=JSON&location=${gcj.lng},${gcj.lat}&key=${AMAP_KEY}&radius=500&extensions=all`,
            { signal: AbortSignal.timeout(8000) })
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (d?.status === '1' && d.regeocode) {
                window._geoSource = '高德';
                const rg = d.regeocode;
                const ac = rg.addressComponent;
                const parts = [];
                if (ac.city) parts.push(ac.city.replace(/市$/, ''));
                if (ac.district) parts.push(ac.district);
                if (ac.township) parts.push(ac.township);
                if (ac.streetNumber?.street) {
                  let s = ac.streetNumber.street;
                  if (ac.streetNumber.number) s += ac.streetNumber.number;
                  if (s.length > 20) s = s.substring(0, 20);
                  parts.push(s);
                }
                let nearestPoi = '';
                if (ac.building?.name && ac.building.name.length > 1) {
                  nearestPoi = ac.building.name;
                } else if (rg.pois && rg.pois.length > 0) {
                  nearestPoi = rg.pois[0].name;
                }
                if (nearestPoi && nearestPoi.length < 15) parts.push(nearestPoi);
                if (rg.pois && rg.pois.length > 0) {
                  nearByPois = rg.pois.map(p => ({ name: p.name, dist: p.distance, addr: p.address, type: p.type }));
                } else if (rg.aois && rg.aois.length > 0) {
                  nearByPois = rg.aois.map(a => ({ name: a.name, dist: a.distance, addr: a.address, type: a.type }));
                } else { nearByPois = []; }
                const addr = parts.filter(Boolean).join(' ');
                return addr.length > 30 ? addr.substring(0, 28) + '..' : addr;
              }
              return null;
            })
            .catch(() => null)
        );

        // 服务2: Nominatim (OpenStreetMap)
        geoPromises.push(
          fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLocation.lat}&lon=${currentLocation.lng}&accept-language=zh&zoom=18`,
            { headers: { 'User-Agent': 'WatermarkCamera/1.0' }, signal: AbortSignal.timeout(5000) })
            .then(r => r.ok ? r.json() : null)
            .then(d => strAddress(d, d?.display_name?.split(',')[0]))
            .catch(() => null)
        );

        // 服务3: ip-api.com（HTTPS）
        geoPromises.push(
          fetch(`https://ip-api.com/json/${currentLocation.lat},${currentLocation.lng}?lang=zh-CN&fields=status,regionName,city,district,zip`,
            { signal: AbortSignal.timeout(5000) })
            .then(r => r.ok ? r.json() : null)
            .then(d => d?.status === 'success' ? strAddress({ city: d.city, district: d.district, state_district: d.regionName }) : null)
            .catch(() => null)
        );

        // 服务4: bigdatacloud
        geoPromises.push(
          fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${currentLocation.lat}&longitude=${currentLocation.lng}&localityLanguage=zh`,
            { signal: AbortSignal.timeout(5000) })
            .then(r => r.ok ? r.json() : null)
            .then(d => d ? strAddress({ city: d.locality || d.city, district: d.principalSubdivision }) : null)
            .catch(() => null)
        );

        // 服务5: geocode.maps.co
        geoPromises.push(
          fetch(`https://geocode.maps.co/reverse?lat=${currentLocation.lat}&lon=${currentLocation.lng}`,
            { signal: AbortSignal.timeout(5000) })
            .then(r => r.ok ? r.json() : null)
            .then(d => d?.address ? strAddress(d.address) : null)
            .catch(() => null)
        );

        // 谁先返回有效地址就用谁
        try {
          const results = await Promise.allSettled(geoPromises);
          for (const r of results) {
            if (r.status === 'fulfilled' && r.value && r.value.length > 2) {
              locationAddress = r.value;
              break;
            }
          }
        } catch (e) { /* 保持坐标显示 */ }

        locationError = false;
        updateWatermarkOverlay();
        updateLocationHint();
        renderPoiList();
      },
      (err) => {
        console.warn('定位失败:', err.message);
        if (err.code === 1) {
          locationAddress = '定位被拒绝';
          showToast('请在 Safari 设置中允许定位权限');
        } else if (err.code === 2) {
          locationAddress = 'GPS信号弱';
        } else if (err.code === 3) {
          locationAddress = '定位超时';
          setTimeout(startLocation, 3000);
          return;
        }
        showToast('自动定位失败，可开「手动输入地址」填写位置');
        locationError = true;
        updateWatermarkOverlay();
        updateLocationHint();
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 120000 }
    );
  }

  // 手动刷新位置（给用户一个重新定位的按钮）
  function refreshLocation() {
    showToast('正在重新定位...');
    startLocation();
  }

  function updateLocationHint() {
    const hint = $('location-status-hint');
    if (!hint) return;
    let text = '';
    if (wmState.useManualAddr) {
      text = '✓ 手动: ' + (wmState.manualAddr || '未填');
    } else if (wmState.usePoi && selectedPoi) {
      text = '✓ ' + selectedPoi;
    } else if (locationAddress) {
      text = locationAddress;
      if (window._geoSource) text += ' [' + window._geoSource + ']';
      if (window._lastGpsCoord) text += ' ' + window._lastGpsCoord.replace('GPS:', '').substring(0, 25);
    } else if (locationError) {
      text = '定位失败，请开启「手动输入地址」';
    } else {
      text = '获取GPS中...';
    }
    hint.textContent = text;
  }

  function renderPoiList() {
    const list = $('poi-list');
    const section = $('poi-section');
    if (!list || !section) return;
    if (!nearByPois || nearByPois.length === 0) { section.style.display = 'none'; return; }
    section.style.display = 'block';
    list.innerHTML = nearByPois.map((p, i) => {
      const dist = parseInt(p.dist) || 0;
      const distText = dist > 1000 ? (dist/1000).toFixed(1)+'km' : dist+'m';
      const active = selectedPoi === p.name ? 'active' : '';
      return `<button class="poi-item ${active}" data-idx="${i}" style="display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 12px;border-radius:10px;background:${selectedPoi === p.name ? 'rgba(0,122,255,0.2)' : 'rgba(255,255,255,0.06)'};color:#fff;font-size:14px;text-align:left;border:none;cursor:pointer;">
        <span style="flex:1">${p.name}</span>
        <span style="font-size:11px;color:rgba(255,255,255,0.4);margin-left:8px;flex-shrink:0;">${distText}</span>
      </button>`;
    }).join('');

    list.querySelectorAll('.poi-item').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.idx);
        const poi = nearByPois[idx];
        if (!poi) return;
        selectedPoi = poi.name;
        wmState.usePoi = true;
        $('toggle-poi').classList.add('on');
        renderPoiList();
        updateLocationHint();
        updateWatermarkOverlay();
      });
    });
  }

  // ==================== 相机初始化 ====================
  async function startCamera() {
    const constraints = {
      video: {
        facingMode: useFrontCamera ? 'user' : 'environment',
        width: { ideal: 1920 },
        height: { ideal: 1080 },
      },
      audio: true,
    };

    // Stop previous stream
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      await video.play();
      $('loading-overlay').classList.add('hidden');
    } catch (err) {
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        showToast('⚠️ 请在设置中允许使用相机和麦克风');
      } else {
        showToast('⚠️ 相机启动失败: ' + err.message);
      }
      $('loading-overlay').classList.add('hidden');
    }
  }

  async function switchCamera() {
    useFrontCamera = !useFrontCamera;
    await startCamera();
  }

  // ==================== 水印绘制 (Canvas) ====================
  function drawWatermarkOnCanvas(ctx, width, height) {
    const fontSize = wmState.size === 'sm' ? Math.round(height * 0.025)
      : wmState.size === 'md' ? Math.round(height * 0.035)
      : wmState.size === 'lg' ? Math.round(height * 0.045)
      : Math.round(height * 0.055);
    const lineHeight = fontSize * 1.35;
    const padding = fontSize * 0.5;

    const colorMap = { white: '#ffffff', yellow: '#ffd700', red: '#ff3b30', blue: '#5ac8fa', green: '#34c759', orange: '#ff9500' };
    ctx.fillStyle = colorMap[wmState.color] || '#ffffff';
    ctx.font = `600 ${fontSize}px -apple-system, "PingFang SC", "Helvetica Neue", sans-serif`;
    ctx.textBaseline = 'top';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = fontSize * 0.5;
    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = 1;

    const lines = [];
    if (wmState.showTime) lines.push(formatTime());
    if (wmState.showDate) lines.push(formatDate());
    if (wmState.showLocation) lines.push(locationAddress || (locationError ? '📍 定位失败' : '📍--'));
    if (wmState.showCustom && wmState.customText) lines.push(wmState.customText);

    // 位置
    let startX, startY;
    switch (wmState.position) {
      case 'tl': startX = padding; startY = padding; break;
      case 'tr': startX = width - padding; ctx.textAlign = 'right'; startY = padding; break;
      case 'bl': startX = padding; startY = height - padding - lines.length * lineHeight; break;
      case 'br': startX = width - padding; ctx.textAlign = 'right'; startY = height - padding - lines.length * lineHeight; break;
      default: startX = padding; startY = padding;
    }

    lines.forEach((line, i) => {
      ctx.fillText(line, startX, startY + i * lineHeight);
    });

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.textAlign = 'start';
  }

  // ==================== 拍照 ====================
  function capturePhoto() {
    if (!stream) { showToast('⚠️ 相机未就绪'); return; }

    const vw = video.videoWidth || 1280;
    const vh = video.videoHeight || 720;

    const canvas = document.createElement('canvas');
    canvas.width = vw;
    canvas.height = vh;
    const ctx = canvas.getContext('2d');

    // 绘制视频帧
    ctx.drawImage(video, 0, 0, vw, vh);
    // 绘制水印
    drawWatermarkOnCanvas(ctx, vw, vh);

    // 保存
    canvas.toBlob((blob) => {
      if (!blob) { showToast('⚠️ 拍照失败'); return; }
      const url = URL.createObjectURL(blob);
      const item = { type: 'photo', blob, url, timestamp: Date.now() };
      galleryItems.unshift(item);
      saveGallery();
      showPreview(item);
      showToast('✅ 拍照成功');
    }, 'image/jpeg', 0.92);
  }

  // ==================== 录像 ====================
  function startRecording() {
    if (!stream) { showToast('⚠️ 相机未就绪'); return; }

    const vw = video.videoWidth || 1280;
    const vh = video.videoHeight || 720;

    // Create recording canvas
    recordingCanvas = document.createElement('canvas');
    recordingCanvas.width = vw;
    recordingCanvas.height = vh;
    recordingCtx = recordingCanvas.getContext('2d');

    // Get canvas stream
    canvasStream = recordingCanvas.captureStream(30);

    // 合并音频
    const audioTracks = stream.getAudioTracks();
    let combinedStream;
    if (audioTracks.length > 0) {
      combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioTracks.map(t => t.clone())
      ]);
    } else {
      combinedStream = canvasStream;
    }

    // 确定编码格式
    let mimeType = '';
    const types = [
      'video/mp4;codecs=h264,aac',
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
      'video/mp4',
      'video/webm;codecs=vp8,opus',
      'video/webm',
    ];
    for (const t of types) {
      if (MediaRecorder.isTypeSupported(t)) { mimeType = t; break; }
    }

    try {
      mediaRecorder = new MediaRecorder(combinedStream, mimeType ? { mimeType } : {});
    } catch (e) {
      showToast('⚠️ 不支持录像功能');
      return;
    }

    recordedChunks = [];
    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      if (recordedChunks.length === 0) { showToast('⚠️ 录制失败'); return; }
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/mp4' });
      const url = URL.createObjectURL(blob);
      const item = { type: 'video', blob, url, timestamp: Date.now() };
      galleryItems.unshift(item);
      saveGallery();
      showPreview(item);
      showToast('✅ 录制完成');

      // 清理
      if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
      if (recordingCanvas) { recordingCanvas = null; recordingCtx = null; }
      if (canvasStream) { canvasStream.getTracks().forEach(t => t.stop()); canvasStream = null; }
    };

    mediaRecorder.onerror = () => {
      showToast('⚠️ 录制出错');
      stopRecording();
    };

    // Start recording
    mediaRecorder.start(1000);

    // Start drawing watermark frames
    isRecording = true;
    // 录像时自动用小字，避免水印太大
    const _ol = $('watermark-overlay');
    ['sm','md','lg','xl'].forEach(s => _ol.classList.remove('wm-size-' + s));
    _ol.classList.add('wm-size-sm');

    function drawFrame() {
      if (!recordingCtx || !recordingCanvas) return;
      recordingCtx.drawImage(video, 0, 0, recordingCanvas.width, recordingCanvas.height);
      drawWatermarkOnCanvas(recordingCtx, recordingCanvas.width, recordingCanvas.height);
      animFrameId = requestAnimationFrame(drawFrame);
    }
    drawFrame();

    // 计时器
    seconds = 0;
    timerDisplay.textContent = '00:00';
    timerEl.classList.add('show');
    timerInterval = setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      timerDisplay.textContent = `${m}:${s}`;
    }, 1000);

    shutterBtn.classList.add('recording');
  }

  function stopRecording() {
    if (!isRecording) return;
    isRecording = false;

    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      try { mediaRecorder.stop(); } catch(e) {}
    }

    if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }

    // 停止计时器
    clearInterval(timerInterval);
    timerEl.classList.remove('show');

    shutterBtn.classList.remove('recording');
  }

  // ==================== 预览 ====================
  function showPreview(item) {
    const modal = $('preview-modal');
    const container = $('preview-media-container');
    const actions = $('preview-actions');

    container.innerHTML = '';
    actions.innerHTML = '';

    if (item.type === 'photo') {
      const img = document.createElement('img');
      img.src = item.url;
      container.appendChild(img);
    } else {
      const vid = document.createElement('video');
      vid.src = item.url;
      vid.controls = true;
      vid.autoplay = false;
      vid.playsInline = true;
      container.appendChild(vid);
    }

    // 保存按钮 - 用分享方式保存到相册（iOS 推荐方式）
    const saveBtn = document.createElement('button');
    saveBtn.className = 'action-btn primary';
    saveBtn.innerHTML = '💾 保存到相册';
    saveBtn.onclick = () => saveToAlbum(item);
    actions.appendChild(saveBtn);

    // 分享按钮
    const shareBtn = document.createElement('button');
    shareBtn.className = 'action-btn secondary';
    shareBtn.innerHTML = '📤 分享';
    shareBtn.onclick = () => shareMedia(item);
    actions.appendChild(shareBtn);

    // 提示
    const tip = document.createElement('div');
    tip.style.cssText = 'text-align:center;font-size:12px;color:rgba(255,255,255,0.35);padding-top:4px;';
    tip.textContent = 'iPhone 点「保存」→ 选择「存储到照片」即可存入相册';
    actions.appendChild(tip);

    modal.classList.add('show');
  }

  // iOS 保存到相册（通过 Share API，用户选"存储到照片"）
  async function saveToAlbum(item) {
    if (!navigator.share) {
      // 不支持分享，用下载方式
      downloadFile(item);
      return;
    }
    try {
      const ext = item.type === 'photo' ? '.jpg' : '.mp4';
      const mime = item.type === 'photo' ? 'image/jpeg' : (item.blob.type || 'video/mp4');
      const file = new File([item.blob], `水印_${formatDate()}_${formatTime()}${ext}`, { type: mime });
      await navigator.share({
        files: [file],
        title: '简单水印相机',
        text: '水印照片/视频'
      });
      showToast('✅ 已分享，选择「存储到照片」保存');
    } catch (e) {
      if (e.name !== 'AbortError') {
        downloadFile(item);
      }
    }
  }

  function downloadFile(item) {
    const a = document.createElement('a');
    a.href = item.url;
    const ext = item.type === 'photo' ? '.jpg' : '.mp4';
    a.download = `水印_${new Date().toISOString().slice(0,19).replace(/[:-]/g,'')}${ext}`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast('✅ 已保存（在"文件"App中可找到）');
  }

  function saveToGallery(item) {
    saveToAlbum(item);
  }

  async function shareMedia(item) {
    if (!navigator.share) {
      saveToGallery(item);
      return;
    }
    try {
      const file = item.type === 'photo'
        ? new File([item.blob], `watermark_${Date.now()}.jpg`, { type: 'image/jpeg' })
        : new File([item.blob], `watermark_${Date.now()}.mp4`, { type: item.blob.type || 'video/mp4' });
      await navigator.share({ files: [file], title: '简单水印相机' });
    } catch (e) {
      if (e.name !== 'AbortError') saveToGallery(item);
    }
  }

  // ==================== 相册管理 ====================
  function saveGallery() {
    try {
      // 只存元数据（blob 太大）— 我们用 IndexedDB 存 blob 引用
      // 简化：只存当前 session 的 blob URL
      updateGalleryGrid();
    } catch(e) { /* ignore */ }
  }

  function updateGalleryGrid() {
    const grid = $('gallery-grid');
    if (galleryItems.length === 0) {
      grid.innerHTML = `<div class="gallery-empty"><div class="big-icon">📸</div><div>还没有拍摄内容<br>去拍一张吧！</div></div>`;
      return;
    }

    grid.innerHTML = galleryItems.map((item, i) => {
      return `<div class="gallery-item" data-index="${i}">
        ${item.type === 'photo'
          ? `<img src="${item.url}" alt="photo">`
          : `<video src="${item.url}" muted></video>`
        }
        <span class="media-type-badge">${item.type === 'photo' ? '📷' : '🎬'}</span>
      </div>`;
    }).join('');

    grid.querySelectorAll('.gallery-item').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.index);
        if (galleryItems[idx]) showPreview(galleryItems[idx]);
      });
    });
  }

  // ==================== Shutter Action ====================
  function onShutterPress() {
    if (currentMode === 'photo') {
      capturePhoto();
    } else {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }
  }

  // ==================== UI Helpers ====================
  let toastTimeout = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function showPanel(id) {
    $(`${id}-overlay`).classList.add('show');
    $(id).classList.add('show');
  }
  function hidePanel(id) {
    $(`${id}-overlay`).classList.remove('show');
    $(id).classList.remove('show');
  }

  // ==================== 初始化设置面板交互 ====================
  function initSettings() {
    // 时间开关
    $('toggle-time').addEventListener('click', () => {
      wmState.showTime = !wmState.showTime;
      $('toggle-time').classList.toggle('on', wmState.showTime);
      updateWatermarkOverlay();
    });
    $('toggle-date').addEventListener('click', () => {
      wmState.showDate = !wmState.showDate;
      $('toggle-date').classList.toggle('on', wmState.showDate);
      updateWatermarkOverlay();
    });
    $('toggle-location').addEventListener('click', () => {
      wmState.showLocation = !wmState.showLocation;
      $('toggle-location').classList.toggle('on', wmState.showLocation);
      updateWatermarkOverlay();
    });
    $('toggle-custom').addEventListener('click', () => {
      wmState.showCustom = !wmState.showCustom;
      $('toggle-custom').classList.toggle('on', wmState.showCustom);
      updateWatermarkOverlay();
    });

    // 自定义文本
    $('custom-text-input').addEventListener('input', (e) => {
      wmState.customText = e.target.value.trim();
      updateWatermarkOverlay();
    });

    // 手动地址开关
    $('toggle-manual-addr').addEventListener('click', () => {
      wmState.useManualAddr = !wmState.useManualAddr;
      $('toggle-manual-addr').classList.toggle('on', wmState.useManualAddr);
      if (wmState.useManualAddr && $('manual-addr-input').value.trim()) {
        wmState.manualAddr = $('manual-addr-input').value.trim();
      }
      updateWatermarkOverlay();
    });

    // 手动地址输入
    $('manual-addr-input').addEventListener('input', (e) => {
      wmState.manualAddr = e.target.value.trim();
      if (wmState.useManualAddr) updateWatermarkOverlay();
    });

    // 刷新定位
    $('btn-refresh-location').addEventListener('click', () => {
      refreshLocation();
    });

    // POI 附近地点开关
    $('toggle-poi').addEventListener('click', () => {
      wmState.usePoi = !wmState.usePoi;
      $('toggle-poi').classList.toggle('on', wmState.usePoi);
      if (!wmState.usePoi) selectedPoi = '';
      renderPoiList();
      updateLocationHint();
      updateWatermarkOverlay();
    });

    // 位置选择
    document.querySelectorAll('#position-options .option-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#position-options .option-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        wmState.position = btn.dataset.pos;
        updateWatermarkOverlay();
      });
    });

    // 颜色选择
    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        wmState.color = dot.dataset.color;
        updateWatermarkOverlay();
      });
    });

    // 大小选择
    document.querySelectorAll('#size-options .option-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#size-options .option-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        wmState.size = btn.dataset.size;
        updateWatermarkOverlay();
      });
    });

    // 面板开关
    $('btn-watermark-settings').addEventListener('click', () => showPanel('watermark-panel'));
    $('watermark-panel-overlay').addEventListener('click', () => hidePanel('watermark-panel'));

    // 相册面板
    $('btn-gallery').addEventListener('click', () => showPanel('gallery-panel'));
    $('gallery-panel-overlay').addEventListener('click', () => hidePanel('gallery-panel'));

    // 设置按钮（完整设置）
    $('btn-settings').addEventListener('click', () => showPanel('watermark-panel'));

    // 预览关闭
    $('preview-close').addEventListener('click', () => {
      $('preview-modal').classList.remove('show');
      // 清理之前的视频播放
      const container = $('preview-media-container');
      const vid = container.querySelector('video');
      if (vid) { vid.pause(); vid.src = ''; }
      container.innerHTML = '';
    });

    // 切换摄像头
    $('btn-switch-camera').addEventListener('click', switchCamera);

    // 模式切换
    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (isRecording) {
          showToast('⏹️ 请先停止录像');
          return;
        }
        modeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
      });
    });

    // 快门
    shutterBtn.addEventListener('click', onShutterPress);
  }

  // ==================== 定时更新时间 ====================
  setInterval(() => {
    if (wmState.showTime || wmState.showDate) updateWatermarkOverlay();
  }, 1000);

  // ==================== 键盘快捷键 ====================
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') { onShutterPress(); e.preventDefault(); }
  });

  // ==================== 启动 ====================
  async function init() {
    initSettings();
    startLocation();
    await startCamera();
    updateWatermarkOverlay();
  }

  // 页面可见性变化时处理相机
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      // 页面隐藏，如果正在录制继续
    } else {
      // 页面重新可见，如果相机流丢失则重启
      if (!video.srcObject) {
        startCamera();
      }
    }
  });

  init();
})();
</script>
</body>
</html>
